<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SquadCheck 관리자</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --card: #1a1d24; --border: #2a2d38; --border2: #343744;
    --text: #e2e8f0; --muted: #8892a4; --muted2: #5a6375;
    --green: #22c55e; --green-dim: #16a34a22; --yellow: #eab308;
    --yellow-dim: #ca8a0422; --red: #ef4444; --red-dim: #ef444422;
    --blue: #60a5fa; --blue-dim: #3b82f622;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ─── Layout ───────────────────────────────── */
  .navbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; border-bottom: 1px solid var(--border);
    background: var(--card); position: sticky; top: 0; z-index: 100;
  }
  .navbar-title { font-size: 15px; font-weight: 700; letter-spacing: .02em; }
  .navbar-title span { color: var(--green); }
  .navbar-meta { display: flex; align-items: center; gap: 12px; }
  .navbar-time { font-size: 12px; color: var(--muted); }
  .btn {
    padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border2);
    background: transparent; color: var(--text); cursor: pointer; font-size: 12px;
    font-family: var(--font); transition: background .15s;
  }
  .btn:hover { background: var(--border2); }
  .btn.loading { opacity: .6; cursor: wait; }
  .spin { display: inline-block; animation: spin .7s linear infinite; margin-right: 4px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
  section { margin-bottom: 28px; }
  .section-title {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin-bottom: 12px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  /* ─── Stats grid ──────────────────────────── */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px;
  }
  .stat-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .05em; }
  .stat-value { font-size: 24px; font-weight: 700; line-height: 1; }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* ─── Two-col ─────────────────────────────── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

  /* ─── Cards ───────────────────────────────── */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden;
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .card-body { padding: 0; overflow-y: auto; max-height: 400px; }

  /* ─── Tables ──────────────────────────────── */
  table { width: 100%; border-collapse: collapse; }
  th { padding: 8px 12px; text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--card); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #ffffff08; }

  /* ─── Badges / pills ──────────────────────── */
  .badge {
    display: inline-block; padding: 2px 7px; border-radius: 100px;
    font-size: 10px; font-weight: 600; line-height: 1.6;
  }
  .badge-green { background: var(--green-dim); color: var(--green); }
  .badge-yellow { background: var(--yellow-dim); color: var(--yellow); }
  .badge-red { background: var(--red-dim); color: var(--red); }
  .badge-blue { background: var(--blue-dim); color: var(--blue); }
  .badge-muted { background: #ffffff0f; color: var(--muted); }

  /* ─── Dot indicators ──────────────────────── */
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
  .dot-green { background: var(--green); }
  .dot-red { background: var(--red); }
  .dot-yellow { background: var(--yellow); }

  /* ─── Tabs ────────────────────────────────── */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 8px 16px; font-size: 12px; font-weight: 500; cursor: pointer;
    border-bottom: 2px solid transparent; color: var(--muted); margin-bottom: -1px;
    transition: color .15s;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--blue); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ─── Signal stage labels ─────────────────── */
  .stage-pill {
    font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 500;
  }
  .stage-expected_to_start { background: #22c55e22; color: #22c55e; }
  .stage-available { background: #22c55e15; color: #86efac; }
  .stage-full_training { background: #3b82f620; color: #93c5fd; }
  .stage-partial_training { background: #eab30820; color: #fde047; }
  .stage-unknown { background: #ffffff0f; color: var(--muted); }

  /* ─── Availability bar ────────────────────── */
  .avail-bar { display: flex; align-items: center; gap: 8px; }
  .avail-pct { font-size: 12px; font-weight: 700; min-width: 38px; }
  .avail-pct.high { color: var(--green); }
  .avail-pct.mid { color: var(--yellow); }
  .avail-pct.low { color: var(--muted); }
  .bar-track { flex: 1; height: 4px; background: var(--border2); border-radius: 2px; min-width: 40px; }
  .bar-fill { height: 100%; border-radius: 2px; transition: width .4s ease; }

  /* ─── Misc ────────────────────────────────── */
  .text-muted { color: var(--muted); }
  .text-green { color: var(--green); }
  .text-yellow { color: var(--yellow); }
  .text-red { color: var(--red); }
  .text-blue { color: var(--blue); }
  .mono { font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 11px; }
  .empty { padding: 24px; text-align: center; color: var(--muted2); font-size: 12px; }
  .error-box { padding: 12px 16px; background: var(--red-dim); border: 1px solid #ef44443a; border-radius: 6px; color: var(--red); font-size: 12px; }
  .snippet {
    background: #0d0f15; border: 1px solid var(--border); border-radius: 4px;
    padding: 6px 8px; font-size: 11px; color: var(--muted); max-width: 300px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: help;
  }
  details summary { cursor: pointer; color: var(--blue); font-size: 11px; user-select: none; }
  details[open] summary { margin-bottom: 6px; }
  .signal-list { padding: 6px 12px 10px; }
  .signal-item { border-left: 2px solid var(--border2); padding: 4px 0 4px 10px; margin-bottom: 6px; }
  .signal-item:last-child { margin-bottom: 0; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-title">Squad<span>Check</span> 관리자</div>
  <div class="navbar-meta">
    <span class="navbar-time" id="last-updated">불러오는 중...</span>
    <button class="btn" id="refresh-btn" onclick="loadAll()">⟳ 새로고침</button>
  </div>
</nav>

<main>
  <!-- ① 전체 현황 -->
  <section>
    <div class="section-title">전체 현황</div>
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><div class="stat-label">불러오는 중</div><div class="stat-value">…</div></div>
    </div>
  </section>

  <!-- ② 신호 파이프라인 + 활성 복귀 신호 -->
  <div class="two-col" style="margin-bottom:28px">
    <!-- 파이프라인 상태 -->
    <div class="card">
      <div class="card-header">
        신호 파이프라인
        <span id="pipeline-badge"></span>
      </div>
      <div class="card-body" id="pipeline-body"><div class="empty">불러오는 중…</div></div>
    </div>
    <!-- 활성 복귀 신호 -->
    <div class="card">
      <div class="card-header">
        활성 복귀 신호
        <span id="signals-badge"></span>
      </div>
      <div class="card-body" id="signals-body"><div class="empty">불러오는 중…</div></div>
    </div>
  </div>

  <!-- ③ 부상 현황 (탭) -->
  <section>
    <div class="section-title">부상 현황</div>
    <div class="card">
      <div class="tabs" id="injury-tabs">
        <div class="tab active" onclick="switchTab('active')">활성 부상 <span id="tab-active-count" class="badge badge-red" style="margin-left:4px"></span></div>
        <div class="tab" onclick="switchTab('stale')">복귀 완료 (stale) <span id="tab-stale-count" class="badge badge-muted" style="margin-left:4px"></span></div>
      </div>
      <div class="card-body" style="max-height:500px">
        <div class="tab-panel active" id="panel-active"><div class="empty">불러오는 중…</div></div>
        <div class="tab-panel" id="panel-stale"><div class="empty">불러오는 중…</div></div>
      </div>
    </div>
  </section>

  <!-- ④ 소스 목록 -->
  <section>
    <div class="section-title">RSS & 크롤 소스</div>
    <div class="card">
      <div class="card-body" style="max-height:460px" id="sources-body"><div class="empty">불러오는 중…</div></div>
    </div>
  </section>
</main>

<script>
// ─── Helpers ─────────────────────────────────────────────────────────────
const API = ''; // relative — served from same origin as the API
const $ = id => document.getElementById(id);

function timeAgo(dateStr) {
  if (!dateStr) return '—';
  const diff = Date.now() - new Date(dateStr).getTime();
  const m = Math.floor(diff / 60000), h = Math.floor(diff / 3600000), d = Math.floor(diff / 86400000);
  if (d >= 1) return d + '일 전';
  if (h >= 1) return h + '시간 전';
  if (m >= 1) return m + '분 전';
  return '방금 전';
}

function fmtDate(dateStr) {
  if (!dateStr) return '—';
  return new Date(dateStr).toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function availColor(pct) {
  if (pct >= 0.7) return 'high'; if (pct >= 0.4) return 'mid'; return 'low';
}
function availBarColor(pct) {
  if (pct >= 0.7) return '#22c55e'; if (pct >= 0.4) return '#eab308'; return '#5a6375';
}

function stageClass(stage) {
  return 'stage-' + (stage || 'unknown');
}
function stageLabel(stage) {
  const m = {
    partial_training: '부분 훈련',
    full_training: '전체 훈련',
    available: '출전 가능',
    expected_to_start: '선발 예상',
  };
  return m[stage] || (stage || '—');
}

function badge(text, cls) { return `<span class="badge ${cls}">${text}</span>`; }

function setLoading(on) {
  const btn = $('refresh-btn');
  btn.classList.toggle('loading', on);
  btn.innerHTML = on ? '<span class="spin">⟳</span> 새로고침 중…' : '⟳ 새로고침';
}

// ─── Tab switch ───────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['active','stale'][i] === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  $('panel-' + name).classList.add('active');
}

// ─── Section renderers ────────────────────────────────────────────────────
function renderStats(stats, status) {
  const avail = status?.availability ?? {};
  const arts  = status?.articles ?? {};
  const sigs  = status?.signals ?? {};
  const items = [
    { label: '부상 기록 (DB)',    value: stats.injuries,        sub: `${stats.fixtures}경기 데이터` },
    { label: '복귀 신호',         value: stats.recoverySignals, sub: `오늘 +${sigs.last24h ?? 0}건` },
    { label: '활성 가용성',       value: avail.activeRecords ?? stats.playerAvailability, sub: `${avail.aboveThreshold ?? 0}명 ≥70%` },
    { label: 'RSS 소스',          value: status?.rssSources?.active ?? '…', sub: `/ ${status?.rssSources?.total ?? stats.rssFeedSources}개` },
    { label: '크롤 소스',         value: status?.crawlSources?.active ?? '…', sub: `/ ${status?.crawlSources?.total ?? '?'}개` },
    { label: '수집 기사',         value: stats.rssArticles ?? arts.totalTracked, sub: `미처리 ${arts.unprocessed ?? 0}건` },
  ];
  $('stats-grid').innerHTML = items.map(i => `
    <div class="stat-card">
      <div class="stat-label">${i.label}</div>
      <div class="stat-value">${i.value ?? '—'}</div>
      <div class="stat-sub">${i.sub}</div>
    </div>`).join('');
}

function renderPipeline(status) {
  const rss   = status.rssSources;
  const crawl = status.crawlSources;
  const sigs  = status.signals;
  const arts  = status.articles;

  const summary = `
    <div style="padding:12px 14px;border-bottom:1px solid var(--border)">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div><div class="text-muted" style="font-size:11px;margin-bottom:2px">RSS 마지막 수집</div><div style="font-size:12px">${timeAgo(rss.lastFetchedAt)}</div></div>
        <div><div class="text-muted" style="font-size:11px;margin-bottom:2px">크롤 마지막 수집</div><div style="font-size:12px">${timeAgo(crawl.lastFetchedAt)}</div></div>
        <div><div class="text-muted" style="font-size:11px;margin-bottom:2px">신호 수집 24h / 7d</div><div style="font-size:12px">${sigs.last24h} / ${sigs.last7d}</div></div>
        <div><div class="text-muted" style="font-size:11px;margin-bottom:2px">분류 방식</div><div style="font-size:12px">${Object.entries(sigs.byClassifier||{}).map(([k,v])=>`${k}:${v}`).join(' | ') || '—'}</div></div>
        <div><div class="text-muted" style="font-size:11px;margin-bottom:2px">오늘 기사</div><div style="font-size:12px">신규 ${arts.discoveredLast24h}건 / 미처리 ${arts.unprocessed}건</div></div>
        <div><div class="text-muted" style="font-size:11px;margin-bottom:2px">최다 신호 소스</div><div style="font-size:12px">${sigs.topSourcesByVolume?.[0]?.sourceName ?? '—'}</div></div>
      </div>
    </div>`;

  $('pipeline-badge').innerHTML = badge('오늘 ' + sigs.last24h + '건', sigs.last24h > 0 ? 'badge-green' : 'badge-muted');
  $('pipeline-body').innerHTML = summary;
}

function renderSignals(data) {
  const players = data.players || [];
  $('signals-badge').innerHTML = badge(players.length + '명', players.length > 0 ? 'badge-green' : 'badge-muted');

  if (!players.length) {
    $('signals-body').innerHTML = '<div class="empty">활성 복귀 신호 없음</div>';
    return;
  }
  const rows = players.map(p => {
    const pct = Math.round(p.predictedAvailability * 100);
    const conf = Math.round(p.confidenceLevel * 100);
    const signalsHtml = p.recentSignals.slice(0,3).map(s => `
      <div class="signal-item">
        <div style="font-size:11px;color:var(--text)">${s.articleTitle || s.articleUrl}</div>
        <div style="display:flex;gap:8px;margin-top:2px;align-items:center">
          <span class="stage-pill ${stageClass(s.signalStage)}">${stageLabel(s.signalStage)}</span>
          <span class="text-muted" style="font-size:10px">${s.sourceName}</span>
          <span class="text-muted" style="font-size:10px">${timeAgo(s.publishedAt)}</span>
          <span class="mono text-muted">신뢰도:${Math.round(s.confidence*100)}%</span>
        </div>
        ${s.extractedSnippet ? `<div class="snippet" title="${s.extractedSnippet}">${s.extractedSnippet}</div>` : ''}
      </div>`).join('');

    return `
      <tr>
        <td>
          <div style="font-weight:600">${p.playerName}</div>
          <div style="font-size:11px;color:var(--muted)">${p.teamName || '—'} · ${p.playerPosition || '?'}</div>
        </td>
        <td>
          <div class="avail-bar">
            <span class="avail-pct ${availColor(p.predictedAvailability)}">${pct}%</span>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${availBarColor(p.predictedAvailability)}"></div></div>
          </div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px">신뢰도 ${conf}%</div>
        </td>
        <td>
          <span class="stage-pill ${stageClass(p.latestSignalStage)}">${stageLabel(p.latestSignalStage)}</span>
        </td>
        <td>
          <div style="font-size:11px">${timeAgo(p.lastSignalAt)}</div>
          <div style="font-size:10px;color:var(--muted)">${p.signalCount}건</div>
        </td>
        <td>
          ${p.upcomingFixture ? `<div style="font-size:11px">${p.upcomingFixture.homeTeam} vs ${p.upcomingFixture.awayTeam}</div><div style="font-size:10px;color:var(--muted)">${fmtDate(p.upcomingFixture.date)}</div>` : '<span class="text-muted">—</span>'}
        </td>
      </tr>
      ${signalsHtml ? `<tr><td colspan="5"><details><summary>신호 출처 ${p.recentSignals.length}건 보기</summary><div class="signal-list">${signalsHtml}</div></details></td></tr>` : ''}`;
  }).join('');

  $('signals-body').innerHTML = `
    <table>
      <thead><tr><th>선수</th><th>출전 가능성</th><th>단계</th><th>최근 신호</th><th>다음 경기</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function renderInjuries(data) {
  const active = data.activeInjuries || [];
  const stale  = data.staleInjuries  || [];
  const s      = data.summary || {};

  $('tab-active-count').textContent = active.length;
  $('tab-stale-count').textContent  = stale.length;

  // 활성 부상
  if (!active.length) {
    $('panel-active').innerHTML = '<div class="empty">활성 부상자 없음</div>';
  } else {
    const rows = active.map(i => {
      const pct  = i.predictedAvailability != null ? Math.round(i.predictedAvailability*100) : null;
      const conf = i.confidenceLevel != null ? Math.round(i.confidenceLevel*100) : null;
      return `<tr>
        <td><div style="font-weight:600">${i.playerName}</div><div style="font-size:11px;color:var(--muted)">${i.teamName}</div></td>
        <td><span style="font-size:12px">${i.reason}</span><br><span class="text-muted" style="font-size:11px">${i.type} · ${i.league}</span></td>
        <td style="color:var(--muted);font-size:11px">${fmtDate(i.injuryDate)}</td>
        <td>
          ${i.hasRecoverySignal
            ? `<div class="avail-bar"><span class="avail-pct ${availColor(i.predictedAvailability)}">${pct}%</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${availBarColor(i.predictedAvailability)}"></div></div></div>
               <div style="font-size:10px;color:var(--muted);margin-top:2px">${stageLabel(i.latestSignalStage)} · 신뢰도 ${conf}%</div>`
            : '<span class="badge badge-muted">신호 없음</span>'}
        </td>
      </tr>`;
    }).join('');
    $('panel-active').innerHTML = `<table><thead><tr><th>선수</th><th>부상 사유</th><th>부상일</th><th>복귀 신호</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  // 복귀 완료 (stale)
  if (!stale.length) {
    $('panel-stale').innerHTML = '<div class="empty">Stale 부상 기록 없음 ✓</div>';
  } else {
    const rows = stale.map(i => `<tr>
      <td><div style="font-weight:600">${i.playerName}</div><div style="font-size:11px;color:var(--muted)">${i.teamName}</div></td>
      <td style="font-size:12px">${i.reason}<br><span class="text-muted" style="font-size:11px">${i.type} · ${i.league}</span></td>
      <td style="color:var(--muted);font-size:11px">${fmtDate(i.injuryDate)}</td>
      <td><span class="text-green" style="font-size:12px">✓ 복귀 완료</span><div style="font-size:11px;color:var(--muted)">${fmtDate(i.returnedAt)}</div><div style="font-size:10px;color:var(--muted2)">${i.returnedFixture || ''}</div></td>
    </tr>`).join('');
    $('panel-stale').innerHTML = `
      <div style="padding:8px 14px;font-size:12px;color:var(--yellow);background:var(--yellow-dim);border-bottom:1px solid var(--border)">
        ⚠ ${stale.length}명의 부상 기록이 남아있지만 이미 경기에 복귀한 선수입니다. 복귀 신호에 나타나면 안 됩니다.
      </div>
      <table><thead><tr><th>선수</th><th>부상 내용</th><th>부상일</th><th>복귀 정보</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
}

function renderSources(status) {
  const all = [
    ...(status.rssSources.sources || []).map(s => ({...s, sourceType:'rss'})),
    ...(status.crawlSources.sources || []).map(s => ({...s, sourceType:'crawl'})),
  ].sort((a,b) => (b.lastFetched||'').localeCompare(a.lastFetched||''));

  if (!all.length) { $('sources-body').innerHTML = '<div class="empty">설정된 소스 없음</div>'; return; }

  // Enrich with signal counts from topSourcesByVolume
  const sigMap = new Map((status.signals.topSourcesByVolume||[]).map(s=>[s.sourceId, s.count]));

  const rows = all.map(s => {
    const sigCount = sigMap.get(s.id) || 0;
    return `<tr>
      <td><span class="dot ${s.active ? 'dot-green' : 'dot-red'}"></span>${s.name}</td>
      <td>${badge(s.sourceType === 'rss' ? 'RSS' : '크롤', s.sourceType==='rss' ? 'badge-blue' : 'badge-yellow')}</td>
      <td style="color:var(--muted);font-size:11px">${timeAgo(s.lastFetched)}<br><span style="color:var(--muted2);font-size:10px">${s.lastFetched ? fmtDate(s.lastFetched) : '미수집'}</span></td>
      <td>${sigCount > 0 ? `<span class="text-green">${sigCount}</span>` : '<span class="text-muted">0</span>'}</td>
      <td>
        <div class="avail-bar">
          <span style="font-size:11px;color:var(--muted);min-width:32px">${Math.round(s.reliability*100)}%</span>
          <div class="bar-track" style="min-width:60px"><div class="bar-fill" style="width:${Math.round(s.reliability*100)}%;background:var(--blue)"></div></div>
        </div>
      </td>
      <td><a href="${s.url}" target="_blank" style="font-size:10px;color:var(--blue)">${s.url.replace(/^https?:\/\//,'').slice(0,40)}</a></td>
    </tr>`;
  }).join('');

  $('sources-body').innerHTML = `
    <table>
      <thead><tr><th>소스명</th><th>유형</th><th>마지막 수집</th><th>신호 수 (전체)</th><th>신뢰도</th><th>URL</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ─── Main load ────────────────────────────────────────────────────────────
async function loadAll() {
  setLoading(true);
  try {
    const season = new URLSearchParams(location.search).get('season') || '2025';
    const [statsRes, statusRes, playersRes, injuriesRes] = await Promise.allSettled([
      fetch(`${API}/api/admin/stats`).then(r=>r.json()),
      fetch(`${API}/api/admin/signals/status`).then(r=>r.json()),
      fetch(`${API}/api/admin/signals/players`).then(r=>r.json()),
      fetch(`${API}/api/admin/signals/injuries?season=${season}`).then(r=>r.json()),
    ]);

    const stats    = statsRes.status    === 'fulfilled' ? statsRes.value    : {};
    const status   = statusRes.status   === 'fulfilled' ? statusRes.value   : null;
    const players  = playersRes.status  === 'fulfilled' ? playersRes.value  : {};
    const injuries = injuriesRes.status === 'fulfilled' ? injuriesRes.value : {};

    if (stats && status)  renderStats(stats, status);
    if (status)           renderPipeline(status);
    if (players)          renderSignals(players);
    if (injuries)         renderInjuries(injuries);
    if (status)           renderSources(status);

    $('last-updated').textContent = new Date().toLocaleTimeString('ko-KR') + ' 업데이트됨';
  } catch (err) {
    console.error(err);
  } finally {
    setLoading(false);
  }
}

// 60초마다 자동 새로고침
loadAll();
setInterval(loadAll, 60_000);
</script>

</html>
