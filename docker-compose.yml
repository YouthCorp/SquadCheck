services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: squadcheck
      POSTGRES_PASSWORD: squadcheck
      POSTGRES_DB: squadcheck
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U squadcheck']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://squadcheck:squadcheck@db:5432/squadcheck
      PORT: '4000'
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  ingestion:
    profiles: [scheduler]
    build: .
    restart: unless-stopped
    environment:
      SERVICE_MODE: scheduler
      DATABASE_URL: postgresql://squadcheck:squadcheck@db:5432/squadcheck
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY}
      API_FOOTBALL_PER_MINUTE: ${API_FOOTBALL_PER_MINUTE:-280}
      API_FOOTBALL_DAILY_LIMIT: ${API_FOOTBALL_DAILY_LIMIT:-7500}
      # ANTHROPIC_API_KEY 미설정 → 시그널 수집(RSS/Claude) 비활성화, 메인 싱크만 실행
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
